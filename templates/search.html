{% extends 'base.html' %} 
{% block content %}
<main class="hero">
    <h1>Bay đến mọi nơi, <span style="color: #00e5ff;">dễ dàng</span> hơn bao giờ hết</h1>
    <p>Tìm kiếm và đặt vé máy bay giá tốt nhất cho mọi hành trình của bạn</p>
</main>

<!-- Chỉ hỗ trợ Hà Nội và Huế -->
<datalist id="danhSachSanBay">
    <option value="Hà Nội (HAN)"></option>
    <option value="Huế (HUI)"></option>
    <!-- <option value="Hồ Chí Minh (SGN)"></option> -->
</datalist>

<section class="search-container">
    <form class="search-form" action="/search" method="GET" onsubmit="return validateForm()">
        
        <div class="form-group">
            <label>LOẠI VÉ</label>
            <select name="loaiVe" style="width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; padding-top: 2px; cursor: pointer; font-family: inherit;">
                <option value="1_chieu" style="color: #000;">Vé 1 chiều</option>
                <option value="khu_hoi" style="color: #000;">Vé khứ hồi</option>
            </select>
        </div>

        <div class="form-group" style="position: relative;">
            <label>ĐIỂM ĐI</label>
            <input type="text" id="diemDi" name="sanBayDi" list="danhSachSanBay" placeholder="Thành phố hoặc Sân bay" onblur="kiemTraDiemBay(this)" required />
            <span class="error-msg" style="color: #ff4d4d; font-size: 11px; position: absolute; bottom: -20px; left: 15px; display: none; font-weight: bold;">Chưa hỗ trợ điểm bay này</span>
        </div>

        <div class="form-group-icon">
            <button type="button" class="swap-btn" onclick="doiChoSanBay()">⇄</button>
        </div>

        <div class="form-group" style="position: relative;">
            <label>ĐIỂM ĐẾN</label>
            <input type="text" id="diemDen" name="sanBayDen" list="danhSachSanBay" placeholder="Thành phố hoặc Sân bay" onblur="kiemTraDiemBay(this)" required />
            <span class="error-msg" style="color: #ff4d4d; font-size: 11px; position: absolute; bottom: -20px; left: 15px; display: none; font-weight: bold;">Chưa hỗ trợ điểm bay này</span>
        </div>

        <div class="form-group">
            <label>NGÀY ĐI</label>
            <input type="date" name="ngayGioDi" required />
        </div>

        <!-- Đã sửa lại định dạng chữ cái đầu viết hoa -->
        <div class="form-group">
            <label>HẠNG GHẾ</label>
            <select name="hangGhe" style="width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; padding-top: 2px; cursor: pointer; font-family: inherit;">
                <option value="Phổ thông" style="color: #000;">1. Phổ thông</option>
                <option value="Premium" style="color: #000;">2. Premium</option>
                <option value="Thương gia" style="color: #000;">3. Thương gia</option>
            </select>
        </div>

        <button type="submit" class="search-submit-btn">→</button>
    </form>
</section>

<script>
    const cacSanBayHoTro = [
        "Hà Nội (HAN)", "Huế (HUI)"
    ];

    function kiemTraDiemBay(inputElement) {
        const errorMsg = inputElement.nextElementSibling;
        const value = inputElement.value.trim();
        
        if (value && !cacSanBayHoTro.includes(value)) {
            inputElement.style.border = "1px solid #ff4d4d";
            inputElement.style.borderRadius = "4px";
            errorMsg.style.display = "block";
            return false;
        } else {
            inputElement.style.border = "none";
            errorMsg.style.display = "none";
            return true;
        }
    }

    function doiChoSanBay() {
        const di = document.getElementById('diemDi');
        const den = document.getElementById('diemDen');
        const temp = di.value;
        di.value = den.value;
        den.value = temp;
        
        kiemTraDiemBay(di);
        kiemTraDiemBay(den);
    }

    function validateForm() {
        const di = document.getElementById('diemDi');
        const den = document.getElementById('diemDen');
        
        const isDiValid = kiemTraDiemBay(di);
        const isDenValid = kiemTraDiemBay(den);
        
        if (!isDiValid || !isDenValid) {
            return false; 
        }
        return true;
    }
</script>
{% endblock %}
