{% extends 'base.html' %}
{% block content %}
<div class="auth-container">
    <div class="auth-box" style="max-width: 550px;">
        <h2>🏠 Trang Quản Trị</h2>
        <p>Chào mừng bạn đã quay trở lại phiên làm việc hệ thống</p>
        
        <div style="background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; text-align: left; margin-bottom: 25px;">
            <div style="margin-bottom: 18px;">
                <span style="color: var(--text-sub); font-size: 11px; display: block; font-weight: 700; letter-spacing: 0.5px;">TÊN TÀI KHOẢN</span>
                <strong style="font-size: 20px; color: var(--text-main);">{{ session.get('hoTen') }}</strong>
            </div>
            <div>
                <span style="color: var(--text-sub); font-size: 11px; display: block; font-weight: 700; letter-spacing: 0.5px;">QUYỀN HẠN TRUY CẬP</span>
                <span style="display: inline-block; background-color: var(--accent-color); color: #121212; padding: 5px 14px; border-radius: 6px; font-weight: 700; font-size: 13px; text-transform: uppercase; margin-top: 5px;">
                    {{ session.get('role') }}
                </span>
            </div>
        </div>

        <div style="display: flex; gap: 15px; justify-content: center;">
            <a href="/chuyen-bay" class="btn" style="background-color: var(--accent-color); color: #121212; text-decoration: none;">Quản lý chuyến bay</a>
            <a href="/logout" class="btn" style="border: 1px solid #ff4d4d; color: #ff4d4d; background: transparent;">Đăng xuất hệ thống</a>
        </div>
    </div>
</div>
{% endblock %}
